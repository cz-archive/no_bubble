name: Upload Release Asset

# 在 Release 发布时，把 xime.custom.yaml 作为附件上传到该 Release。
# Release 附件不可变，因此会有一个固定的 sha256 值（在 Release 页面可看到 digest）。
on:
  release:
    types: [published]
  # 兜底入口：万一 release 事件没能触发（例如 tag 早于本 workflow），
  # 可以在 Actions 页面手动指定 tag 重新上传。
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（例如 1.0.1）"
        required: true
        type: string

# 上传 Release 附件需要写权限
permissions:
  contents: write

jobs:
  upload:
    name: Upload xime.custom.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # release 事件取 release 的 tag；手动触发时取输入的 tag
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Generate SHA256 checksum
        run: sha256sum xime.custom.yaml > xime.custom.yaml.sha256

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag }}" \
            xime.custom.yaml \
            xime.custom.yaml.sha256 \
            --clobber
